<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>关于 · Nonoka Lab</title>
  <link rel="stylesheet" href="../css/cupertino.css?v=20260818" />
</head>
<body>
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="icon-info" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r="0.6" fill="currentColor"/></g>
      <g id="icon-refresh" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-1.5 5"/><path d="M20 5v6h-6"/></g>
      <g id="icon-megaphone" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4a1 1 0 0 0 1 1h2l8 4V5L7 9H5a1 1 0 0 0-1 1z"/><path d="M18 9a3 3 0 0 1 0 6"/></g>
      <g id="icon-clock" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g>
    </defs>
  </svg>

  <div class="page">
    <div class="card" id="aboutCard"></div>
    <div class="card" id="statsCard"></div>
  </div>

  <script src="../js/page.js"></script>
  <script>
  (function () {
    var P = window.Page;
    function api() { return P.api(); }

    var ISSUES_BASE = "";
    var dlModal = null;

    /* ---- 自建弹窗：支持富文本正文、可自由更新、不自动关闭 ---- */
    function openModal(title, bodyHTML, actions, opts) {
      var mask = P.el('<div class="modal-mask show"><div class="modal"><h3></h3>' +
        '<div class="modal-body" style="font-size:14px;line-height:1.7"></div>' +
        '<div class="acts"></div></div></div>');
      mask.querySelector("h3").textContent = title;
      mask.querySelector(".modal-body").innerHTML = bodyHTML || "";
      var acts = mask.querySelector(".acts");
      function add(label, cls, onClick) {
        var b = P.el('<button class="' + (cls || "btn") + '"></button>');
        b.textContent = label;
        b.addEventListener("click", function () {
          if (onClick && onClick() === false) return;
          close();
        });
        acts.appendChild(b);
      }
      (actions || []).forEach(function (a) {
        if (a.href) {
          acts.appendChild(P.el('<a class="btn" href="' + a.href + '" target="_blank" rel="noopener">' + P.esc(a.label) + "</a>"));
        } else add(a.label, a.cls, a.onClick);
      });
      function close() { if (mask.parentNode) mask.parentNode.removeChild(mask); }
      if (!opts || !opts.noMaskClose) {
        mask.addEventListener("click", function (e) { if (e.target === mask) close(); });
      }
      document.body.appendChild(mask);
      return { mask: mask, el: mask.querySelector(".modal"), close: close };
    }

    /* ---- 下载进度弹窗：显示进度条，完成后自动转成「完成」提示 ---- */
    function openDownloadModal() {
      var m = openModal(P.T("downloading"),
        '<div class="muted" id="dlStatus" style="white-space:pre-wrap">' +
        P.tfmt("download_progress", { percent: 0 }) + "</div>" +
        '<div class="progress" style="margin-top:8px"><i id="dlFill" style="width:0"></i></div>',
        null, { noMaskClose: true });
      var fill = m.el.querySelector("#dlFill");
      var status = m.el.querySelector("#dlStatus");
      m.el.querySelector(".acts").innerHTML = "";
      var ignore = P.el('<button class="btn gray"></button>');
      ignore.textContent = P.T("ignore");
      ignore.addEventListener("click", m.close);
      m.el.querySelector(".acts").appendChild(ignore);
      dlModal = {
        close: function () { m.close(); dlModal = null; },
        setProgress: function (fetched, total) {
          var pc = total ? Math.round(fetched / total * 100) : 0;
          fill.style.width = Math.min(100, pc) + "%";
          status.textContent = P.tfmt("download_progress", { percent: pc });
        },
        complete: function (path) {
          m.close(); dlModal = null;
          var body = P.tfmt("download_done_body", { path: path || "" });
          var md = openModal(P.T("download_done"),
            '<div class="muted" style="white-space:pre-wrap">' + P.esc(body) + "</div>",
            [{ label: P.T("open_folder"), onClick: function () { api().open_external_folder(path); } },
             { label: P.T("ok"), cls: "btn gray" }]);
          md.el.querySelector(".acts").style.justifyContent = "center";
        },
        fail: function (reason) {
          m.close(); dlModal = null;
          openModal(P.T("download_failed"),
            '<div class="muted" style="white-space:pre-wrap">' + P.esc(reason || "") + "</div>",
            [{ label: P.T("ok"), cls: "btn gray" }]);
        },
      };
    }

    /* 下载进度事件（后端 download_update 推送） */
    P.onPage("onUpdateEvent", function (info) {
      if (!dlModal || !info) return;
      if (info.progress) dlModal.setProgress(info.fetched || 0, info.total || 0);
      else if (info.done) {
        if (info.ok) dlModal.complete(info.path);
        else dlModal.fail(info.error || "");
      }
    });

    function render() {
      Promise.resolve(api().get_brand()).then(function (brand) {
        var card = document.getElementById("aboutCard");
        card.innerHTML =
          '<div style="display:flex;align-items:center;justify-content:center;gap:14px">' +
          '<img src="../assets/logo.svg" alt="logo" style="width:48px;height:48px" />' +
          '<div><div style="font-size:20px;font-weight:700">' + P.esc(brand.app_name) + "</div>" +
          '<div class="muted" style="font-size:13px">' + P.T("about_version") + ' <span id="verText" style="cursor:pointer;color:var(--accent-press)">v' + P.esc(brand.version) + "</span> · " +
          P.T("about_publisher") + "：" + P.esc(brand.publisher) + "</div></div></div>" +
          '<div class="row center wrap" style="margin-top:16px">' +
          '<button class="btn ghost" id="btnCheck">' + P.T("about_check_update") + "</button>" +
          '<button class="btn gray" id="btnFeedback">' + P.T("about_feedback") + "</button>" +
          '<button class="btn gray" id="btnAbout">' + P.T("nav_about") + "</button></div>" +
          '<div class="card" style="margin-top:16px;background:var(--fill-2)"><h3>' + P.T("about_disclaimer") + "</h3>" +
          '<p class="hint" style="white-space:pre-wrap;line-height:1.7">' + P.esc(P.T("disclaimer_text")) + "</p></div>";
        ISSUES_BASE = (brand.repo_url || "").replace(/\/+$/, "") || "https://github.com/Nonoka-fukigen/NonokaLab";
        // 彩蛋：连续点击版本号 3 次切换开发者模式（带视觉反馈）
        var ver = card.querySelector("#verText");
        var clicks = 0, timer = null;
        ver.addEventListener("click", function () {
          clicks++;
          ver.classList.remove("shake");
          void ver.offsetWidth;  // 重启动画
          ver.classList.add("shake");
          clearTimeout(timer);
          timer = setTimeout(function () { clicks = 0; }, 1200);
          if (clicks >= 3) {
            clicks = 0;
            Promise.resolve(api().get_dev_mode()).then(function (dev) {
              return api().set_dev_mode(!dev);
            }).then(function () {
              try { window.parent.postMessage({ __nonoka_nav_refresh: true }, "*"); } catch (e) {}
              return api().get_dev_mode();
            }).then(function (v) {
              P.modal(P.T("nav_dev"), v ? P.T("dev_mode_warning") : P.T("dev_mode_label") + " OFF");
            }).catch(function () {});
          }
        });

        /* 功能一：检查更新 */
        card.querySelector("#btnCheck").addEventListener("click", function () {
          api().check_update().then(function (info) {
            info = (info && info.data !== undefined) ? info.data : info;
            info = info || {};
            if (info.error) { P.modal(P.T("check_update_failed"), P.T("check_update_failed_body")); return; }
            if (!info.update_available) { P.modal(P.T("latest"), P.tfmt("latest_body", { current: info.current })); return; }
            var body = P.tfmt("update_find_body", { current: info.current, latest: info.latest, notes: info.notes || "" });
            P.modal(P.tfmt("update_find", { latest: info.latest }), body, [
              { label: P.T("download_update"), onClick: function () { startDownload(); } },
              { label: P.T("ignore"), cls: "btn gray" }]);
          }).catch(function () { P.modal(P.T("check_update_failed"), P.T("check_update_failed_body")); });
        });

        /* 功能二：反馈问题 —— 直接跳转浏览器到 Issues 新建页 */
        card.querySelector("#btnFeedback").addEventListener("click", function () {
          var url = ISSUES_BASE + "/issues/new";
          api().open_external_url(url).then(function (r) {
            r = (r && r.data !== undefined) ? r.data : r;
            if (!r || r.ok === false) {
              P.modal(P.T("open_browser_failed"), P.tfmt("open_browser_failed_body", { url: url }));
            }
          }).catch(function () {
            P.modal(P.T("open_browser_failed"), P.tfmt("open_browser_failed_body", { url: url }));
          });
        });

        /* 功能三：关于弹窗 */
        card.querySelector("#btnAbout").addEventListener("click", function () { showAbout(brand); });

      }).catch(function (e) { P.modal(P.T("crash_title"), String(e)); });

      loadStats();
    }

    function row(label, value) {
      return '<div style="display:flex;justify-content:space-between;gap:12px">' +
        '<span class="muted">' + P.esc(label) + "</span><span>" + P.esc(value) + "</span></div>";
    }
    function showAbout(brand) {
      var body =
        '<div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:6px">' +
        '<img src="../assets/logo.svg" alt="logo" style="width:52px;height:52px" />' +
        '<div style="text-align:center"><div style="font-size:22px;font-weight:700">' + P.esc(brand.app_name) + "</div>" +
        '<div class="muted" style="font-size:13px">' + P.T("about_tagline") + "</div></div></div>" +
        '<div style="margin-top:14px">' +
        row(P.T("about_version"), "v" + P.esc(brand.version)) +
        row(P.T("about_publisher"), P.esc(brand.publisher)) +
        row(P.T("about_license"), "MIT License") +
        row(P.T("about_tech"), "Python + WebView2 + FFmpeg") +
        "</div>" +
        '<div class="row center wrap" style="margin-top:18px">' +
        '<button class="btn ghost" id="aboutRepoBtn">' + P.T("about_repo") + '</button>' +
        '<button class="btn" id="aboutOkBtn">' + P.T("ok") + "</button></div>";
      var m = openModal(P.T("about_modal_title"), body);
      m.el.querySelector("#aboutRepoBtn").addEventListener("click", function () {
        api().open_external_url(brand.repo_url || (ISSUES_BASE || "https://github.com/Nonoka-fukigen/NonokaLab"));
      });
      m.el.querySelector("#aboutOkBtn").addEventListener("click", m.close);
      m.el.querySelector(".acts").style.display = "none";
    }

    /* 开始下载：打开进度弹窗并通知后端，进度由 onUpdateEvent 推送 */
    function startDownload() {
      if (dlModal) dlModal.close();
      openDownloadModal();
      api().download_update().then(function (r) {
        if (!r || (r && r.data && r.data.error)) { } // 错误会在 onUpdateEvent 中透传
      }).catch(function () { if (dlModal) dlModal.fail(P.T("download_failed")); });
    }

    function loadStats() {
      Promise.resolve(api().get_stats()).then(function (s) {
        s = s || {};
        var byType = s.by_type || {};
        var typeStr = Object.keys(byType).map(function (k) { return k + "：" + byType[k]; }).join("，") || "—";
        var card = document.getElementById("statsCard");
        card.innerHTML =
          "<h3>" + P.icon("clock") + " " + P.T("about_usage") + "</h3>" +
          '<div class="row wrap" style="margin-top:6px">' +
          statBox(P.T("stat_downloads"), s.downloads || 0) +
          statBox(P.T("stat_plugins_enabled"), s.plugins_enabled || 0) +
          statBox(P.T("stat_days"), s.days || 0) + "</div>" +
          '<div class="muted" style="margin-top:10px;font-size:13px">' + P.T("stat_by_type") + "：" + P.esc(typeStr) + "</div>";
      }).catch(function () {});
    }
    function statBox(label, val) {
      return '<div style="flex:1;min-width:120px;background:var(--fill-2);border-radius:12px;padding:12px 14px">' +
        '<div style="font-size:22px;font-weight:700;color:var(--accent-press)">' + val + "</div>" +
        '<div class="muted" style="font-size:12px">' + P.esc(label) + "</div></div>";
    }

    Page.boot(render);
  })();
  </script>
</body>
</html>
