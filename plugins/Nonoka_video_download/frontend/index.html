<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>视频下载</title>
  <link rel="stylesheet" href="../../../frontend/css/cupertino.css?v=20260817" />
  <link rel="stylesheet" href="css/app.css?v=20260817" />
</head>
<body>
  <!-- 图标定义（与外壳一致） -->
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="icon-video" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10.5 21 7.5v9L16 13.5"/></g>
      <g id="icon-photo" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.6"/><path d="M5 17l4.5-4.5 3 3L16 11l3 3.5"/></g>
      <g id="icon-puzzle" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4h4a2 2 0 0 1 4 0v2a2 2 0 0 0 2 2 2 2 0 0 1 0 4 2 2 0 0 0-2 2v2a2 2 0 0 1-4 0h-4a2 2 0 0 1 0-4 2 2 0 0 0-2-2 2 2 0 0 1 0-4 2 2 0 0 0 2-2V6a2 2 0 0 1 0-2z"/></g>
      <g id="icon-info" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r="0.6" fill="currentColor"/></g>
      <g id="icon-folder" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g>
      <g id="icon-cloud" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.3A3.5 3.5 0 0 1 17 18z"/><path d="M12 12v6M9.5 14.5 12 12l2.5 2.5"/></g>
      <g id="icon-bilibili" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="3"/><path d="M8 4l2 3M16 4l-2 3M9 12v1M15 12v1"/></g>
      <g id="icon-music" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17V5l10-2v12"/><circle cx="6.5" cy="17" r="2.5"/><circle cx="16.5" cy="15" r="2.5"/></g>
      <g id="icon-douyin" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M12 9v6"/><circle cx="12" cy="15" r="2.2"/><path d="M15 7a3 3 0 0 0 3 3"/></g>
    </defs>
  </svg>

  <div class="wrap">
    <h2>视频下载</h2>
    <p class="lead">选择平台，粘贴链接即可直接下载。</p>

    <div class="card run-bar" id="runBar">
      <div class="icon" style="color:var(--accent)"><svg class="icon" aria-hidden="true"><use href="#icon-video"/></svg></div>
      <span id="runStatus" class="tag wait">未运行</span>
      <span class="muted" id="runHint" style="font-size:12.5px">插件启停请使用左侧导航栏的开关按钮</span>
    </div>

    <!-- FFmpeg 提醒 -->
    <div class="ffmpeg-banner" id="ffmpegBanner" style="display:none">
      <svg class="icon" aria-hidden="true"><use href="#icon-cloud"/></svg>
      <div class="ffmpeg-banner-body">
        <div class="ffmpeg-banner-title">未检测到 FFmpeg</div>
        <div class="ffmpeg-banner-text">未检测到 ffmpeg 组件，音视频合并等高级功能可能受限，可在「设置 → 组件管理」中安装或手动指定路径。</div>
      </div>
      <button class="ffmpeg-dismiss" id="ffmpegDismiss" title="不再提醒">✕</button>
    </div>

    <!-- 平台选择（手动） -->
    <div class="seg-row">
      <div class="seg platform-seg" id="platformSeg"></div>
    </div>

    <!-- 下载 / 封面 两标签切换 -->
    <div class="seg-row">
      <div class="seg tab-seg">
        <button data-tab="video" class="on">下载视频</button>
        <button data-tab="cover">下载封面</button>
      </div>
    </div>

    <!-- 链接输入 -->
    <div class="card">
      <div class="field" style="margin:0">
        <label>视频链接 / BV号 / 抖音分享口令</label>
        <div class="url-row">
          <input class="input" id="url" placeholder="粘贴 https://... 或 BVxxxx 或抖音口令" />
        </div>
        <div class="detect-row" style="margin-top:8px">
          <span class="muted" style="font-size:12.5px">链接识别：</span>
          <span class="tag wait" id="urlDetect">待粘贴链接</span>
        </div>
      </div>
    </div>

    <!-- 下载标签：下载模式 + 清晰度 -->
    <div class="card tab-pane" id="paneVideo">
      <div class="opt-grid">
        <div class="field" style="margin:0">
          <label>下载模式</label>
          <div class="seg" id="modeSeg">
            <button data-m="video">仅视频</button>
            <button data-m="audio">仅音频</button>
            <button data-m="both" class="on">视频+音频</button>
          </div>
        </div>
        <div class="field" id="qualityField" style="margin:0">
          <label>清晰度上限（B站，提示值）</label>
          <select class="input" id="quality">
            <option>360p</option><option>480p</option><option>720p</option>
            <option selected>1080p</option><option>1080p+</option><option>4k</option>
          </select>
        </div>
      </div>
      <div id="ffWarn" class="tag wait" style="display:none;margin-top:12px">
        未检测到 FFmpeg，「视频+音频」合并将不可用，请到「组件管理」安装。
      </div>
    </div>

    <!-- 封面标签：封面清晰度增强 -->
    <div class="card tab-pane" id="paneCover" style="display:none">
      <div class="opt-grid">
        <div class="field" style="margin:0">
          <label>封面清晰度增强</label>
          <select class="input" id="scale">
            <option value="1">原图 (1x)</option>
            <option value="2" selected>2x</option>
            <option value="4">4x</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 保存位置 -->
    <div class="card">
      <div class="field" style="margin:0">
        <label>保存位置（留空使用默认下载目录）</label>
        <div class="row">
          <input class="input" id="folder" placeholder="点击「选择」或直接输入/粘贴路径" />
          <button class="btn" id="btnBrowse">选择</button>
        </div>
      </div>
    </div>

    <!-- B站 Cookie（识别为 B站 时显示） -->
    <div class="card cookie-area" id="cookieField" style="display:none">
      <label style="display:block;font-size:13px;font-weight:600;color:var(--label-2);margin-bottom:7px">B站登录 Cookie（可选，不填清晰度受限）</label>
      <textarea class="input" id="cookie" placeholder="SESSDATA=xxxx; bili_jct=yyyy（可点「扫码登录」自动填入）"></textarea>
      <div class="row center" style="margin-top:10px">
        <button class="btn ghost" id="btnQr">扫码登录</button>
        <button class="btn gray" id="btnCookieHelp">Cookie 说明</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnMain">⬇ 开始下载</button>
      <button class="btn gray" id="btnOpen" style="display:none">打开文件夹</button>
      <span id="status" class="tag wait">等待链接</span>
    </div>

    <div class="progress" id="prog" style="margin-top:14px"><i></i></div>
    <div class="logbox" id="logbox" style="margin-top:12px"></div>
  </div>

  <!-- 扫码登录弹窗 -->
  <div class="modal-mask" id="qrMask">
    <div class="modal">
      <h3>扫码登录 B站</h3>
      <div style="text-align:center;padding:10px 0">
        <img class="qr-img" id="qrImg" alt="qr" />
      </div>
      <p style="text-align:center" class="muted">用哔哩哔哩 App 扫码并确认</p>
      <div class="acts" style="justify-content:center">
        <button class="btn gray" id="qrClose">关闭</button>
      </div>
    </div>
  </div>

  <!-- 通用弹窗 -->
  <div class="modal-mask" id="mMask">
    <div class="modal">
      <h3 id="mTitle"></h3>
      <p id="mBody"></p>
      <div class="acts">
        <button class="btn gray" id="mClose">知道了</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
