name: Build & Release Nonoka Lab

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.0.0）"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
          echo "版本: $VERSION"

      - name: 预下载 FFmpeg（可选，失败不影响主程序）
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p packaging/ffmpeg
          curl -L --max-time 120 "https://ghfast.top/https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o packaging/ffmpeg/ff.zip
          python - <<'PY'
          import zipfile, os
          try:
              z = zipfile.ZipFile("packaging/ffmpeg/ff.zip")
              for n in z.namelist():
                  if n.lower().endswith("ffmpeg.exe"):
                      with open("packaging/ffmpeg/ffmpeg.exe", "wb") as f:
                          f.write(z.read(n))
                      print("ffmpeg.exe 已就绪")
                      break
          except Exception as e:
              print("FFmpeg 预下载跳过:", e)
          PY

      - name: PyInstaller 打包 exe
        run: python build.py

      - name: 安装 Inno Setup
        run: choco install innosetup -y

      - name: 下载 Inno Setup 中文语言文件
        shell: powershell
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path "installer" | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "installer\ChineseSimplified.isl"

      - name: 生成安装包
        run: iscc /DMyAppVersion=${{ env.VERSION }} installer/setup.iss

      - name: 打包视频下载插件 ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path 'installer\out' | Out-Null
          Compress-Archive -Path 'plugins\Nonoka_video_download\*' -DestinationPath 'installer\out\Nonoka_video_download.zip' -Force

      - name: 上传 Release 资产
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            installer/out/NonokaLab_Setup_v${{ env.VERSION }}.exe
            installer/out/Nonoka_video_download.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
